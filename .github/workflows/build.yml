name: Build and Publish Roblox Place

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UNIVERSE_ID: "8860447734"
  START_PLACE_ID: "79281925900541"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit and Rojo
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Verify Rojo
        run: rojo --version

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/2015-CODE-ROT.rbxlx

      - name: Upload RBXLX
        uses: actions/upload-artifact@v4
        with:
          name: 2015-CODE-ROT-place-${{ env.START_PLACE_ID }}
          path: build/2015-CODE-ROT.rbxlx
          if-no-files-found: error
          retention-days: 14

      - name: Check Roblox API key scopes
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          jq -n --arg key "$ROBLOX_API_KEY" '{apiKey:$key}' \
            | curl --silent --show-error --fail-with-body \
                --request POST "https://apis.roblox.com/api-keys/v1/introspect" \
                --header "Content-Type: application/json" \
                --data-binary @- \
            | jq '{enabled,expired,scopes}'

      - name: Publish to Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          curl --fail-with-body --location --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${START_PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@build/2015-CODE-ROT.rbxlx"
