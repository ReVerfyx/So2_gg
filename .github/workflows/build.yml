name: Build and Publish CITY RUSH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: city-rush-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UNIVERSE_ID: "8860447734"
  START_PLACE_ID: "79281925900541"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit and Rojo
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Verify Rojo
        run: rojo --version

      - name: Install Luau compiler and test runtime
        run: |
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile

      - name: Compile scripts and test rules
        run: python3 tools/test_luau.py --luau /tmp/luau/luau --compile /tmp/luau/luau-compile

      - name: Validate project invariants
        run: python3 tools/validate.py

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/CITY-RUSH.rbxlx

      - name: Upload RBXLX
        uses: actions/upload-artifact@v4
        with:
          name: CITY-RUSH-place-${{ env.START_PLACE_ID }}
          path: build/CITY-RUSH.rbxlx
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Roblox
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          curl --fail-with-body --location --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${START_PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@build/CITY-RUSH.rbxlx"
