name: Build Roblox Place

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  START_PLACE_ID: "79281925900541"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit and Rojo
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true

      - name: Verify Rojo
        run: rojo --version

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json -o build/2015-CODE-ROT.rbxlx

      - name: Upload RBXLX
        uses: actions/upload-artifact@v4
        with:
          name: 2015-CODE-ROT-place-${{ env.START_PLACE_ID }}
          path: build/2015-CODE-ROT.rbxlx
          if-no-files-found: error
          retention-days: 14
